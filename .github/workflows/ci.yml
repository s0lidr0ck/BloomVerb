name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            validate_command: bash ./scripts/validate-local.sh --mode tests-only --preset linux-tests
            setup_command: bash ./scripts/setup-linux-build-env.sh
          - os: windows-latest
            validate_command: ./scripts/validate-local.ps1 -Mode tests-only -Preset windows-tests
            setup_command: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.setup_command != ''
        run: ${{ matrix.setup_command }}

      - name: Validate
        run: ${{ matrix.validate_command }}

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-test-logs
          path: |
            out/build/**/Testing/**
            out/build/**/LastTest.log
